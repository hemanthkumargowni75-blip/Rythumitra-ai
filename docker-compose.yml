version: '3.9'

services:
  # ----------------------------------------------------------------------------
  # 1. RythuMitra Web & Edge Application (Next.js 14)
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rythumitra-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api/v1
      - FASTAPI_BACKEND_URL=http://api:8000
      - DATABASE_URL=postgresql://rythu_admin:rythu_secure_pass_2026@postgis:5432/rythumitra_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=rythu_mitra_ai_production_jwt_super_secret_key_2026
    depends_on:
      api:
        condition: service_healthy
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rythumitra-network

  # ----------------------------------------------------------------------------
  # 2. RythuMitra AI & Geospatial Microservice (FastAPI + Shapely + GeoPandas)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rythumitra-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=postgis
      - POSTGRES_USER=rythu_admin
      - POSTGRES_PASSWORD=rythu_secure_pass_2026
      - POSTGRES_DB=rythumitra_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=rythu_mitra_ai_production_jwt_super_secret_key_2026
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rythumitra-network

  # ----------------------------------------------------------------------------
  # 3. Spatial Farm Database (PostgreSQL 16 + PostGIS 3.4)
  # ----------------------------------------------------------------------------
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: rythumitra-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: rythu_admin
      POSTGRES_PASSWORD: rythu_secure_pass_2026
      POSTGRES_DB: rythumitra_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rythu_admin -d rythumitra_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rythumitra-network

  # ----------------------------------------------------------------------------
  # 4. In-Memory Cache & OTP Session Store (Redis 7)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rythumitra-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass rythu_redis_pass_2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "rythu_redis_pass_2026", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - rythumitra-network

networks:
  rythumitra-network:
    driver: bridge

volumes:
  postgis_data:
    driver: local
  redis_data:
    driver: local
